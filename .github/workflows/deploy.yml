name: Deploy

# Pushes to main deploy dev, v* tags deploy prod.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: foxd-io/actions/.github/workflows/deploy-static-site.yml@v1
    with:
      bucket_prefix: www-herbcodex-org
      environment: ${{ inputs.environment }}
